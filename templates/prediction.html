<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Demand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="prediction">
    <div class="page-shell">
        <header class="topbar">
            <a class="brand" href="{{ url_for('home') }}">Retail Demand AI</a>
            <nav class="nav-links">
                <a href="{{ url_for('home') }}">Home</a>
                <a class="active" href="{{ url_for('prediction_page') }}">Prediction</a>
                <a href="{{ url_for('dashboard_page') }}">Dashboard</a>
            </nav>
        </header>

        <main class="content-grid">
            <section class="panel reveal">
                <div class="section-heading">
                    <span class="eyebrow">Demand Estimator</span>
                    <h1>Predict Future Demand</h1>
                </div>
                <form id="prediction-form" class="prediction-form">
                    <label>
                        Product Category
                        <select name="category" required>
                            {% for category in categories %}
                            <option value="{{ category }}">{{ category }}</option>
                            {% endfor %}
                        </select>
                    </label>

                    <label>
                        Price
                        <input type="number" name="price" min="1" step="0.01" placeholder="Enter product price" required>
                    </label>

                    <label>
                        Past Sales
                        <input type="number" name="past_sales" min="0" step="1" placeholder="Enter past sales" required>
                    </label>

                    <label>
                        Season
                        <select name="season" required>
                            {% for season in seasons %}
                            <option value="{{ season }}">{{ season.title() }}</option>
                            {% endfor %}
                        </select>
                    </label>

                    <label>
                        Discount: <span id="discount-value">10%</span>
                        <input id="discount-input" type="range" name="discount" min="0" max="50" value="10">
                    </label>

                    <button class="primary-btn" type="submit">
                        <span class="btn-text">Predict Demand</span>
                        <span class="loader hidden"></span>
                    </button>
                </form>
            </section>

            <aside class="panel result-panel reveal delay-1">
                <div class="section-heading">
                    <span class="eyebrow">Prediction Result</span>
                    <h2>Demand Insights</h2>
                </div>
                <div id="result-card" class="result-card">
                    <p class="muted">Submit the form to see the forecasted demand and demand level.</p>
                </div>
                <div id="error-box" class="error-box hidden"></div>
            </aside>
        </main>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
